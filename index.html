<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CODEX 2.0 - Executive Training Dashboard v2</title>
  
  <!-- Google tag (gtag.js) & Google Tag Manager Container -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FG3C70FT5N"></script>
  <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-WJCHNPVJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    // Configure GA4 measurement and fire immediate page view hit
    gtag('config', 'G-FG3C70FT5N', {
      send_page_view: true
    });
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- React & Babel Standalone CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Babel Configuration -->
  <script>
    Babel.registerPreset('react-standalone', {
      presets: [
        [Babel.availablePresets['react'], { runtime: 'classic' }]
      ]
    });
  </script>

  <style>
    :root {
      --brand-canvas: #021812;
      --brand-panel: rgba(6, 32, 25, 0.72);
      --brand-gold: #C8A46B;
      --brand-gold-glow: rgba(200, 164, 107, 0.18);
      --brand-bronze: rgba(143, 107, 62, 0.35);
      --brand-cream: #F5F3EE;
      --brand-muted: #8F9E96;
      --ease-fluid: cubic-bezier(0.16, 1, 0.3, 1);
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--brand-canvas);
      color: var(--brand-cream);
    }

    .font-cinzel {
      font-family: 'Cinzel', serif;
    }

    /* Ardena-inspired Glass Panel */
    .ardena-glass {
      background: var(--brand-panel);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--brand-bronze);
    }

    .ardena-glass-subtle {
      background: rgba(4, 24, 18, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(143, 107, 62, 0.22);
    }

    /* Subtle cursor glow specular backdrop */
    .glow-canvas {
      background: radial-gradient(circle 900px at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(200, 164, 107, 0.04), transparent 60%);
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #021812;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(143, 107, 62, 0.45);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #C8A46B;
    }

    /* Shimmer animation for view loading transition */
    @keyframes shimmer-sweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .animate-shimmer {
      animation: shimmer-sweep 1.8s infinite;
    }

    /* Split panel smooth morphing */
    .split-panel-anim {
      transition: width 0.45s var(--ease-fluid), flex 0.45s var(--ease-fluid), opacity 0.3s ease;
    }

    /* Emblem Gold Halo Pulse */
    @keyframes emblem-pulse {
      0%, 100% {
        box-shadow: 0 0 20px rgba(200, 164, 107, 0.25), inset 0 0 10px rgba(200, 164, 107, 0.15);
        border-color: rgba(200, 164, 107, 0.4);
      }
      50% {
        box-shadow: 0 0 35px rgba(200, 164, 107, 0.45), inset 0 0 15px rgba(200, 164, 107, 0.25);
        border-color: rgba(200, 164, 107, 0.7);
      }
    }
    .animate-emblem-glow {
      animation: emblem-pulse 2.2s ease-in-out infinite;
    }

    /* Luxury Radial Veil Dissolve (100% Solid to Block White Flashes) */
    .loading-veil {
      background: radial-gradient(circle at center, #06281e 0%, #021812 85%);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      transition: opacity 0.65s var(--ease-fluid), transform 0.65s var(--ease-fluid), visibility 0.65s;
    }
    .loading-veil.fade-out {
      opacity: 0;
      transform: scale(1.02);
      visibility: hidden;
      pointer-events: none;
    }
    .report-frame {
      background-color: #021812;
      transition: opacity 0.65s var(--ease-fluid), transform 0.65s var(--ease-fluid);
    }
  </style>
</head>
<body class="bg-[#021812] text-[#F5F3EE] overflow-hidden select-none selection:bg-[#C8A46B] selection:text-[#021812]">
  
  <div id="root"></div>

  <script type="text/babel" data-presets="react-standalone">
    const { useState, useEffect, useRef } = React;

    const RAW_DATA_URL = 'https://docs.google.com/spreadsheets/d/17pl95MG7qbn4NGn_YookTwkAYTopBUIvZj7jyq_Kcq0/edit?usp=drive_link';

    // Durations for adaptive loading transitions
    const COLD_LOAD_DURATION = 3800; // 3.8s gives Looker Studio sufficient time to paint dark layout
    const WARM_LOAD_DURATION = 700;  // 0.7s snappy switch for cached frames

    const LOOKER_STUDIO_URLS = {
      'EA Journey': 'https://datastudio.google.com/embed/reporting/f49cc02b-3dfa-411b-a5b3-a680b862bf32/page/p_wkqgjo6n4d?pageNavigation=hidden', 
      'LX Performance': 'https://datastudio.google.com/embed/reporting/f49cc02b-3dfa-411b-a5b3-a680b862bf32/page/THoyF?pageNavigation=hidden', 
      'Pre-Training': 'https://datastudio.google.com/embed/reporting/f49cc02b-3dfa-411b-a5b3-a680b862bf32/page/p_fzru8en83d?pageNavigation=hidden',
      'Training': 'https://datastudio.google.com/embed/reporting/f49cc02b-3dfa-411b-a5b3-a680b862bf32/page/p_tu8qg2e43d?pageNavigation=hidden',
      'Pre-Matching': 'https://datastudio.google.com/embed/reporting/f49cc02b-3dfa-411b-a5b3-a680b862bf32/page/p_zu5a8w613d?pageNavigation=hidden',
      'Post-Match': 'https://datastudio.google.com/embed/reporting/f49cc02b-3dfa-411b-a5b3-a680b862bf32/page/p_phk7g5d33d?pageNavigation=hidden',
      'Churn Data': 'https://datastudio.google.com/embed/reporting/f49cc02b-3dfa-411b-a5b3-a680b862bf32/page/p_xevgdwhf4d?pageNavigation=hidden',
      'LX Pilot: No CRC': 'https://datastudio.google.com/embed/reporting/f49cc02b-3dfa-411b-a5b3-a680b862bf32/page/p_vl1ngeyp8d?pageNavigation=hidden',
      'LX Pilot: FVC': 'https://datastudio.google.com/embed/reporting/f49cc02b-3dfa-411b-a5b3-a680b862bf32/page/p_yk9yd3uq8d?pageNavigation=hidden',
      'LX Pilot: Hybrid Setup': 'https://datastudio.google.com/embed/reporting/f49cc02b-3dfa-411b-a5b3-a680b862bf32/page/p_4py806wq8d?pageNavigation=hidden'
    };

    const TAB_OPTIONS = Object.keys(LOOKER_STUDIO_URLS);

    const TAB_ICONS = {
      'EA Journey': 'M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7',
      'LX Performance': 'M12 14l2-2m6.364-3.636a9 9 0 11-12.728 0M12 3v2m-6.364 1.636l1.414 1.414m11.314 0l1.414-1.414',
      'Pre-Training': 'M12 21a9 9 0 100-18 9 9 0 000 18zm0-4a5 5 0 100-10 5 5 0 000 10zm0-2a3 3 0 100-6 3 3 0 000 6z',
      'Training': 'M4.26 10.147a60.436 60.436 0 00-.491 6.347A48.627 48.627 0 0112 20.904a48.627 48.627 0 018.232-4.41 60.46 60.46 0 00-.491-6.347m-15.482 0a50.57 50.57 0 00-2.658-.813A59.905 59.905 0 0112 3.493a59.902 59.902 0 0110.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.697 50.697 0 0112 13.489a50.702 50.702 0 017.74-3.342',
      'Pre-Matching': 'M12 3c2.755 0 5.455.232 8.083.678.539.092.917.576.917 1.13v2.83a2.25 2.25 0 01-.659 1.591l-5.432 5.432a2.25 2.25 0 00-.659 1.591v2.927a2.25 2.25 0 01-1.244 2.013L9.75 22.5V16.25a2.25 2.25 0 00-.659-1.591L3.659 9.227A2.25 2.25 0 013 7.636V4.808c0-.554.378-1.038.917-1.13A48.56 48.56 0 0112 3z',
      'Post-Match': 'M7.5 21L3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5',
      'Churn Data': 'M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9',
      // Laboratory Glassware Suite for Pilot Programs
      'LX Pilot: No CRC': 'M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5m4.75-11.396A2.25 2.25 0 0112 3c.875 0 1.674.5 2.05 1.258m-4.3 0h4.5m0 0v5.714a2.25 2.25 0 00.659 1.591L19 14.5m-9.25 6.5h9.5a2.25 2.25 0 002.05-3.158l-3.8-7.6A2.25 2.25 0 0015.45 9H8.55a2.25 2.25 0 00-2.05 1.242l-3.8 7.6A2.25 2.25 0 004.75 21z',
      'LX Pilot: FVC': 'M10 2.5h4M10.5 2.5v5.8a6.5 6.5 0 103 0V2.5M7.8 14.5a6.45 6.45 0 008.4 0',
      'LX Pilot: Hybrid Setup': 'M4.5 3.75h15M6 3.75v13.5a3.75 3.75 0 003.75 3.75h4.5a3.75 3.75 0 003.75-3.75V3.75M6 8.5h4m-4 3.5h5m-5 3.5h3'
    };

    const tabToSlug = (tabName) => tabName.toLowerCase().replace(/[^a-z0-9]+/g, '-');
    
    const getTabFromURL = () => {
      // Priority 1: Query parameter '?tab='
      const params = new URLSearchParams(window.location.search);
      const tabParam = params.get('tab');
      if (tabParam) {
        const match = TAB_OPTIONS.find(t => tabToSlug(t) === tabParam.toLowerCase());
        if (match) return match;
      }
      // Priority 2: Hash fragment fallback
      const rawHash = window.location.hash.replace('#', '').toLowerCase();
      if (rawHash) {
        const matchHash = TAB_OPTIONS.find(t => tabToSlug(t) === rawHash);
        if (matchHash) return matchHash;
      }
      return null;
    };

    function App() {
      const initialTab = getTabFromURL() || 'LX Performance';
      const [selectedTab, setSelectedTab] = useState(initialTab);
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [systemAlert, setSystemAlert] = useState(null);
      const [isTransitioning, setIsTransitioning] = useState(true);
      const [loadingPhase, setLoadingPhase] = useState("Compiling datasets...");
      const [visitedTabs, setVisitedTabs] = useState(() => new Set([initialTab]));
      const [loadedIframes, setLoadedIframes] = useState(() => new Set());
      
      // Split View State
      const [isSplitView, setIsSplitView] = useState(false);
      const [comparisonTab, setComparisonTab] = useState(TAB_OPTIONS[1] || TAB_OPTIONS[0]);

      // Dynamic specular cursor follower
      const rootRef = useRef(null);
      useEffect(() => {
        const handleMouseMove = (e) => {
          if (!rootRef.current) return;
          const { clientX, clientY } = e;
          rootRef.current.style.setProperty('--mouse-x', `${clientX}px`);
          rootRef.current.style.setProperty('--mouse-y', `${clientY}px`);
        };
        window.addEventListener('mousemove', handleMouseMove);
        return () => window.removeEventListener('mousemove', handleMouseMove);
      }, []);

      // Initial Cold Load on Mount (3.8s)
      useEffect(() => {
        const phaseTimer = setTimeout(() => {
          setLoadingPhase("Rendering metrics...");
        }, 1800);

        const completeTimer = setTimeout(() => {
          setIsTransitioning(false);
        }, COLD_LOAD_DURATION);

        return () => {
          clearTimeout(phaseTimer);
          clearTimeout(completeTimer);
        };
      }, []);

      // Browser popstate handler for back/forward buttons
      useEffect(() => {
        const handlePopState = () => {
          const tabFromNav = getTabFromURL();
          if (tabFromNav && tabFromNav !== selectedTab) {
            handleTabSelect(tabFromNav, false);
          }
        };
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, [selectedTab]);

      // Responsive sidebar collapse on smaller screens
      useEffect(() => {
        const handleResize = () => {
          if (window.innerWidth < 1366) {
            setSidebarCollapsed(true);
          }
        };
        handleResize();
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      const triggerAlert = (message) => {
        setSystemAlert(message);
        setTimeout(() => setSystemAlert(null), 3500);
      };

      const handleTabSelect = (tabId, updateUrl = true) => {
        if (tabId === selectedTab) return;
        
        setIsTransitioning(true);
        setSelectedTab(tabId);
        
        // Adaptive loading duration: 3.8s for cold visit, 0.7s for cached visit
        const isFirstVisit = !visitedTabs.has(tabId);
        const duration = isFirstVisit ? COLD_LOAD_DURATION : WARM_LOAD_DURATION;

        if (isFirstVisit) {
          setVisitedTabs(prev => new Set([...(prev || []), tabId]));
          setLoadingPhase("Compiling datasets...");
          setTimeout(() => {
            setLoadingPhase("Rendering metrics...");
          }, 1800);
        } else {
          setLoadingPhase("Rendering metrics...");
        }

        if (updateUrl) {
          try {
            const slug = tabToSlug(tabId);
            const newUrl = `${window.location.pathname}?tab=${slug}`;
            window.history.pushState({ tab: slug }, '', newUrl);
          } catch (e) {
            // Fallback for sandboxed iframes or local file:// where pushState throws SecurityError
            try {
              window.location.hash = tabToSlug(tabId);
            } catch (err) {}
          }
        }

        // Fire Google Analytics page view & custom selection event with safety wrapper
        try {
          if (typeof gtag === 'function') {
            gtag('event', 'page_view', {
              page_title: `CODEX 2.0 - ${tabId}`,
              page_location: window.location.href
            });
            gtag('event', 'select_content', {
              content_type: 'dashboard_tab',
              item_id: tabId
            });
          }
        } catch (e) {
          console.warn("Analytics event dispatch deferred:", e);
        }

        if (!isSplitView) {
          triggerAlert(`Switched to: ${tabId}`);
        }

        setTimeout(() => {
          setIsTransitioning(false);
        }, duration);
      };

      const toggleSplitView = () => {
        const nextState = !isSplitView;
        setIsSplitView(nextState);

        // Track split-view usage in Google Analytics
        if (typeof gtag === 'function') {
          gtag('event', 'toggle_split_view', {
            is_split: nextState,
            primary_view: selectedTab,
            comparison_view: comparisonTab
          });
        }

        triggerAlert(nextState ? "Split Comparison View Engaged" : "Single Workspace View Restored");
      };

      const activeEmbedUrlPrimary = LOOKER_STUDIO_URLS[selectedTab];
      const activeEmbedUrlSecondary = LOOKER_STUDIO_URLS[comparisonTab];

      return (
        <div ref={rootRef} className="glow-canvas h-screen w-screen bg-[#021812] text-[#F5F3EE] font-sans antialiased flex flex-col md:flex-row overflow-hidden select-none relative">
          
          {/* =========================================================
              COLLAPSIBLE SIDEBAR WITH ARDENA SPECULAR ACCENTS
              ========================================================= */}
          {!isSplitView && (
            <aside className={`shrink-0 ardena-glass border-r border-[#8F6B3E]/30 flex flex-col z-20 transition-all duration-400 ease-[cubic-bezier(0.16,1,0.3,1)] ${
              sidebarCollapsed ? 'w-full md:w-20' : 'w-full md:w-60'
            }`}>
              
              {/* Brand Header */}
              <div className={`p-4 md:p-5 border-b border-[#8F6B3E]/25 flex transition-all duration-300 ${
                sidebarCollapsed ? 'flex-col items-center gap-3' : 'items-center justify-between'
              }`}>
                <div className="flex items-center gap-3 overflow-hidden group">
                  <div className="w-9 h-9 relative shrink-0 flex items-center justify-center bg-gradient-to-br from-[#063328] to-[#021E16] rounded-xl border border-[#C8A46B]/40 shadow-[0_0_14px_rgba(200,164,107,0.22)] transition-transform duration-300 group-hover:scale-105">
                    <svg className="w-5 h-5 text-[#C8A46B]" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="1.6">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M12 21v-8.25M15.75 21v-8.25M8.25 21v-8.25M3 9l9-6 9 6m-1.5 12V10.332A48.36 48.36 0 0 0 12 9.75c-2.551 0-5.056.2-7.5.582V21M3 21h18M12 6.75h.008v.008H12V6.75Z" />
                    </svg>
                  </div>
                  
                  <div className={`transition-all duration-300 ${sidebarCollapsed ? 'opacity-0 max-w-0 pointer-events-none' : 'opacity-100 max-w-full'}`}>
                    <h1 className="text-base font-bold tracking-[0.2em] text-[#F5F3EE] uppercase font-cinzel whitespace-nowrap">CODEX 2.0</h1>
                    <p className="text-[9px] text-[#A7B5AC] tracking-widest uppercase whitespace-nowrap font-mono opacity-80">Executive Analytics</p>
                  </div>
                </div>

                <button 
                  onClick={() => setSidebarCollapsed(!sidebarCollapsed)}
                  className="hidden md:flex p-1.5 rounded-lg border border-[#8F6B3E]/35 hover:border-[#C8A46B] text-[#C8A46B] bg-[#021812]/70 hover:bg-[#063328]/60 transition-all duration-200 cursor-pointer shrink-0 shadow-sm hover:scale-105"
                  title={sidebarCollapsed ? "Expand Sidebar" : "Collapse Sidebar"}
                >
                  <svg className={`w-3.5 h-3.5 transform transition-transform duration-300 ${sidebarCollapsed ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2.5">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
                  </svg>
                </button>
              </div>

              {/* Navigation Rail with Magnetic Active Indicator */}
              <nav className="flex-1 p-2.5 space-y-1.5 overflow-y-auto relative">
                {!sidebarCollapsed && (
                  <div className="px-3 pt-2 pb-1.5 flex items-center justify-between">
                    <span className="text-[10px] font-bold text-[#8F6B3E] tracking-[0.2em] uppercase font-mono">
                      Modules
                    </span>
                    <span className="text-[9px] text-[#C8A46B]/60 font-mono">10</span>
                  </div>
                )}
                
                {TAB_OPTIONS.map((tabId) => {
                  const isActive = selectedTab === tabId;
                  const iconPath = TAB_ICONS[tabId] || 'M13 10V3L4 14h7v7l9-11h-7z';
                  
                  return (
                    <button
                      key={tabId}
                      onClick={() => handleTabSelect(tabId)}
                      className={`group w-full relative flex items-center rounded-xl transition-all duration-300 cursor-pointer overflow-hidden ${
                        sidebarCollapsed ? 'justify-center py-2.5' : 'justify-between px-3 py-2.5'
                      } ${
                        isActive 
                          ? 'bg-gradient-to-r from-[#063328] via-[#093c30] to-[#04241b] text-[#C8A46B] shadow-[inset_0_1px_0_rgba(200,164,107,0.35),0_4px_12px_rgba(0,0,0,0.3)] border border-[#C8A46B]/30' 
                          : 'text-[#A7B5AC] hover:text-[#F5F3EE] hover:bg-[#063328]/35 border border-transparent hover:border-[#8F6B3E]/20'
                      }`}
                      title={sidebarCollapsed ? tabId : ""}
                    >
                      {/* Active Indicator Bar */}
                      {isActive && (
                        <span className="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-5 rounded-r bg-[#C8A46B] shadow-[0_0_8px_#C8A46B]"></span>
                      )}

                      <div className="flex items-center gap-3 z-10 transition-transform duration-200 group-hover:translate-x-0.5">
                        <svg className={`w-4 h-4 shrink-0 transition-colors duration-200 ${isActive ? 'text-[#C8A46B]' : 'text-[#8F6B3E] group-hover:text-[#C8A46B]'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="1.8">
                          <path strokeLinecap="round" strokeLinejoin="round" d={iconPath} />
                        </svg>
                        
                        {!sidebarCollapsed && (
                          <span className={`text-xs whitespace-nowrap tracking-wide transition-colors duration-200 ${isActive ? 'font-semibold text-[#F5F3EE]' : 'font-normal'}`}>
                            {tabId}
                          </span>
                        )}
                      </div>

                      {!sidebarCollapsed && isActive && (
                        <span className="w-1.5 h-1.5 rounded-full bg-[#C8A46B] shadow-[0_0_8px_#C8A46B]"></span>
                      )}
                    </button>
                  );
                })}
              </nav>

              {/* Persistent Raw Spreadsheet Link */}
              <div className="p-2.5 border-t border-[#8F6B3E]/20 shrink-0">
                <a 
                  href={RAW_DATA_URL}
                  target="_blank"
                  rel="noopener noreferrer"
                  className={`w-full flex items-center rounded-xl transition-all duration-300 hover:bg-[#063328]/60 hover:border-[#C8A46B]/40 group border border-[#8F6B3E]/20 bg-[#021812]/50 ${
                    sidebarCollapsed ? 'justify-center py-2.5' : 'justify-between px-3 py-2'
                  }`}
                  title="Open Raw Data Spreadsheet"
                >
                  <div className="flex items-center gap-3">
                    <svg className="w-4 h-4 shrink-0 text-[#8F6B3E] group-hover:text-[#C8A46B] transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="1.8">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M3.75 3v11.25A2.25 2.25 0 006 16.5h12a2.25 2.25 0 002.25-2.25V3m-16.5 0h16.5m-16.5 0a2.25 2.25 0 012.25-2.25h12A2.25 2.25 0 0118 3m-12 4.5h12m-12 4.5h12M9 16.5v3.75M15 16.5v3.75M3 12h18" />
                    </svg>
                    {!sidebarCollapsed && (
                      <div className="text-left leading-tight">
                        <p className="text-[11px] font-semibold text-[#F5F3EE] group-hover:text-[#C8A46B] transition-colors">Raw Data Feed</p>
                        <p className="text-[9px] text-[#A7B5AC] font-mono">Google Sheets</p>
                      </div>
                    )}
                  </div>
                  {!sidebarCollapsed && (
                    <svg className="w-3 h-3 text-[#8F6B3E] group-hover:text-[#C8A46B] transition-all transform group-hover:translate-x-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                    </svg>
                  )}
                </a>
              </div>
            </aside>
          )}

          {/* =========================================================
              MAIN CONTENT WORKSPACE & EXECUTIVE CONTROLS
              ========================================================= */}
          <main className="flex-1 flex flex-col min-w-0 bg-[#021812] h-screen overflow-hidden">
            
            {/* Top Bar with Glassmorphic Trim */}
            <header className="ardena-glass border-b border-[#8F6B3E]/25 py-2 px-4 shrink-0 flex items-center justify-between z-10 shadow-lg">
              <div className="flex items-center gap-3">
                <span className="text-[10px] px-2.5 py-1 bg-gradient-to-r from-[#063328] to-[#0A2B22] text-[#C8A46B] border border-[#8F6B3E]/40 rounded-full font-mono uppercase tracking-widest shadow-sm">
                  CODEX v2.0
                </span>
                
                <div className="flex items-center gap-2 px-2.5 py-1 rounded-full bg-[#021812]/60 border border-[#8F6B3E]/20" title="Telemetry Active">
                  <span className="w-2 h-2 rounded-full bg-red-400 shadow-[0_0_8px_#34d399] animate-pulse"></span>
                  <span className="text-[11px] text-[#A7B5AC] font-mono tracking-wide">Data Refresh</span>
                </div>

                {!isSplitView && (
                  <span className="hidden lg:inline text-xs font-cinzel tracking-wider text-[#C8A46B]/90 pl-2 border-l border-[#8F6B3E]/30">
                    {selectedTab}
                  </span>
                )}
              </div>

              {/* Action Buttons */}
              <div className="flex items-center gap-2.5">
                <button 
                  onClick={toggleSplitView}
                  className={`flex items-center gap-2 px-3 py-1.5 rounded-xl text-xs font-medium border transition-all duration-300 cursor-pointer shadow-sm hover:scale-[1.02] active:scale-[0.98] ${
                    isSplitView 
                      ? 'bg-gradient-to-r from-[#063328] to-[#0A2B22] border-[#C8A46B] text-[#C8A46B] shadow-[0_0_15px_rgba(200,164,107,0.25)]' 
                      : 'bg-[#021812]/70 border-[#8F6B3E]/40 text-[#A7B5AC] hover:border-[#C8A46B] hover:text-[#F5F3EE]'
                  }`}
                  title="Toggle Side-by-Side Analysis Mode"
                >
                  <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="1.8">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                    <line x1="12" y1="3" x2="12" y2="21" />
                  </svg>
                  <span>Split View</span>
                </button>
              </div>
            </header>

            {/* Ardena Toast Alert Notification */}
            {systemAlert && (
              <div className="absolute top-16 right-6 ardena-glass border border-[#C8A46B]/40 px-3.5 py-2 text-xs text-[#F5F3EE] rounded-xl shadow-2xl z-50 flex items-center gap-2.5 backdrop-blur-xl animate-fade-in">
                <span className="w-1.5 h-1.5 rounded-full bg-[#C8A46B] shadow-[0_0_6px_#C8A46B]"></span>
                <span className="font-mono text-[11px] tracking-wide text-[#F5F3EE]">{systemAlert}</span>
              </div>
            )}

            {/* =========================================================
                DYNAMIC VIEWPORT WITH GLASS SHIMMER TRANSITION
                ========================================================= */}
            <div className="flex-1 w-full bg-[#021812] overflow-hidden min-h-0 relative flex flex-row">
              
              {/* PRIMARY PANEL */}
              <div className={`relative flex flex-col h-full overflow-hidden split-panel-anim ${
                isSplitView ? 'w-1/2 shrink-0 border-r border-[#8F6B3E]/30' : 'w-full'
              }`}>
                
                {/* Split View Dropdown Selector for Primary */}
                {isSplitView && (
                  <div className="w-full shrink-0 ardena-glass border-b border-[#8F6B3E]/20 p-2 z-10 flex justify-between items-center px-4">
                    <span className="text-[10px] font-bold text-[#8F6B3E] tracking-widest uppercase font-mono">Primary View</span>
                    <select 
                      value={selectedTab} 
                      onChange={(e) => handleTabSelect(e.target.value)}
                      className="bg-[#021812] text-[#C8A46B] border border-[#8F6B3E]/50 rounded-lg text-xs font-mono uppercase px-2.5 py-1 outline-none focus:border-[#C8A46B] cursor-pointer"
                    >
                      {TAB_OPTIONS.map(tab => (
                        <option key={tab} value={tab}>{tab}</option>
                      ))}
                    </select>
                  </div>
                )}

                <div className="flex-1 w-full relative bg-[#021812]">
                  {/* The Emphasized Loading Screen (Ardena Signature) */}
                  <div className={`loading-veil absolute inset-0 z-30 flex flex-col items-center justify-center ${
                    isTransitioning ? 'opacity-100' : 'fade-out'
                  }`}>
                    <div className="text-center relative z-10 max-w-sm px-6">
                      {/* Dynamic Tab Icon with Warm Gold Halo */}
                      <div className="w-16 h-16 mx-auto mb-5 flex items-center justify-center bg-gradient-to-br from-[#063328] via-[#04241b] to-[#021812] rounded-2xl border border-[#C8A46B]/40 animate-emblem-glow shadow-[0_0_25px_rgba(200,164,107,0.25)]">
                        <svg className="w-8 h-8 text-[#C8A46B]" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="1.6">
                          <path strokeLinecap="round" strokeLinejoin="round" d={TAB_ICONS[selectedTab] || 'M13 10V3L4 14h7v7l9-11h-7z'} />
                        </svg>
                      </div>

                      {/* Clean Module Title */}
                      <h2 className="text-sm font-cinzel font-bold text-[#F5F3EE] tracking-[0.25em] uppercase mb-6">
                        {selectedTab}
                      </h2>

                      {/* Wider Precision Track Bar with Liquid Shimmer */}
                      <div className="w-56 h-1 bg-[#063328] rounded-full mx-auto overflow-hidden relative shadow-[0_0_15px_rgba(200,164,107,0.25)] border border-[#8F6B3E]/30">
                        <div className="absolute inset-0 bg-gradient-to-r from-transparent via-[#C8A46B] to-transparent animate-shimmer"></div>
                      </div>

                      {/* Live Dynamic Status Telemetry */}
                      <div className="h-6 flex items-center justify-center mt-4">
                        <p className="text-xs font-mono tracking-[0.18em] text-[#C8A46B] uppercase animate-pulse">
                          {loadingPhase}
                        </p>
                      </div>
                    </div>
                  </div>

                  {/* Multi-Iframe Background Pool: Keeps visited reports alive in memory & eliminates white flashes */}
                  <div className="absolute inset-0 w-full h-full bg-[#021812] overflow-hidden">
                    {Array.from(visitedTabs).map((tabId) => {
                      const url = LOOKER_STUDIO_URLS[tabId];
                      if (!url) return null;
                      const isCurrent = tabId === selectedTab;

                      return (
                        <div 
                          key={tabId}
                          className={`report-frame absolute inset-0 w-full h-full bg-[#021812] ${
                            isCurrent
                              ? (isTransitioning ? 'opacity-0 scale-[0.995] pointer-events-none' : 'opacity-100 scale-100 pointer-events-auto')
                              : 'opacity-0 pointer-events-none invisible'
                          }`}
                          style={{ zIndex: isCurrent ? 10 : 0 }}
                        >
                          <iframe 
                            src={url} 
                            onLoad={() => setLoadedIframes(prev => new Set([...(prev || []), tabId]))}
                            className="absolute left-0 top-0 w-full bg-[#021812]"
                            style={{ height: 'calc(100% + 36px)', border: 'none', colorScheme: 'dark', backgroundColor: '#021812' }}
                            allowFullScreen
                            sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"
                          ></iframe>
                        </div>
                      );
                    })}

                    {/* Pending Module Fallback Card */}
                    {!LOOKER_STUDIO_URLS[selectedTab] && (
                      <div className="w-full h-full flex flex-col items-center justify-center p-6 text-center bg-[#01140E]">
                        <svg className="w-10 h-10 text-[#8F6B3E]/40 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                        </svg>
                        <p className="text-xs font-cinzel tracking-widest text-[#C8A46B] uppercase mb-1">Module Pending</p>
                        <p className="text-[10px] text-[#A7B5AC] font-mono max-w-xs mt-1">
                          Report link for {selectedTab} is being provisioned.
                        </p>
                      </div>
                    )}
                  </div>
                </div>
              </div>

              {/* SECONDARY PANEL (Fluidly unfolds when Split View is engaged) */}
              {isSplitView && (
                <div className="relative flex flex-col h-full w-1/2 shrink-0 overflow-hidden bg-[#01140E] split-panel-anim border-l border-[#8F6B3E]/20">
                  
                  {/* Split View Header for Secondary */}
                  <div className="w-full shrink-0 ardena-glass border-b border-[#8F6B3E]/20 p-2 z-10 flex justify-between items-center px-4">
                    <span className="text-[10px] font-bold text-[#8F6B3E] tracking-widest uppercase font-mono">Comparison View</span>
                    <select 
                      value={comparisonTab} 
                      onChange={(e) => setComparisonTab(e.target.value)}
                      className="bg-[#021812] text-[#C8A46B] border border-[#8F6B3E]/50 rounded-lg text-xs font-mono uppercase px-2.5 py-1 outline-none focus:border-[#C8A46B] cursor-pointer"
                    >
                      {TAB_OPTIONS.map(tab => (
                        <option key={tab} value={tab}>{tab}</option>
                      ))}
                    </select>
                  </div>

                  <div className="flex-1 w-full relative bg-[#021812]">
                    {activeEmbedUrlSecondary ? (
                      <div className="absolute inset-0 w-full h-full overflow-hidden bg-[#021812]">
                        <iframe 
                          src={activeEmbedUrlSecondary} 
                          className="absolute left-0 top-0 w-full bg-[#021812]"
                          style={{ height: 'calc(100% + 36px)', border: 'none', colorScheme: 'dark', backgroundColor: '#021812' }}
                          allowFullScreen
                          sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"
                        ></iframe>
                      </div>
                    ) : (
                      <div className="w-full h-full flex flex-col items-center justify-center p-6 text-center bg-[#01140E]">
                        <svg className="w-10 h-10 text-[#8F6B3E]/40 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                        </svg>
                        <p className="text-xs font-cinzel tracking-widest text-[#C8A46B] uppercase mb-1">Module Pending</p>
                        <p className="text-[10px] text-[#A7B5AC] font-mono max-w-xs mt-1">
                          Report link for {comparisonTab} is being provisioned.
                        </p>
                      </div>
                    )}
                  </div>
                </div>
              )}
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
